<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Pruebas Unitarias - Turnos YA</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent-brand: #22c55e;
            --accent-brand-dark: #16a34a;
            --accent-brand-light: #dcfce7;
            --success-bg: #dcfce7;
            --success-text: #15803d;
            --success-border: #bbf7d0;
            --danger-bg: #fee2e2;
            --danger-text: #991b1b;
            --danger-border: #fecaca;
            --neutral-bg: #f1f5f9;
            --neutral-text: #64748b;
            --neutral-border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
            line-height: 1.5;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 1.5rem;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        h1 span {
            color: var(--accent-brand-dark);
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-top: 0.25rem;
            font-weight: 500;
        }

        .btn-run-all {
            background-color: var(--accent-brand);
            color: white;
            border: none;
            padding: 0.8rem 1.8rem;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(34, 197, 94, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-run-all:hover {
            background-color: var(--accent-brand-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(22, 163, 74, 0.4);
        }

        .btn-run-all:active {
            transform: translateY(1px);
        }

        .summary-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background-color: var(--bg-secondary);
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 1.25rem;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 0.25rem;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-total { color: var(--text-primary); }
        .stat-passed { color: var(--accent-brand-dark); }
        .stat-failed { color: var(--danger-text); }
        .stat-pending { color: var(--neutral-text); }

        .section-header {
            margin: 2.5rem 0 1rem 0;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-brand-dark);
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-header::after {
            content: '';
            flex-grow: 1;
            height: 2px;
            background: linear-gradient(90deg, rgba(34, 197, 94, 0.2) 0%, rgba(34, 197, 94, 0) 100%);
            margin-left: 1rem;
        }

        .test-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .test-card {
            background-color: var(--bg-secondary);
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 1.5rem;
            display: grid;
            grid-template-columns: 3.5rem 1fr auto;
            gap: 1.5rem;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03);
            transition: all 0.3s ease;
        }

        .test-card:hover {
            border-color: rgba(34, 197, 94, 0.3);
            background-color: #fafbfc;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        .test-number {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-brand-dark);
            background: var(--accent-brand-light);
            width: 3rem;
            height: 3rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .test-info {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .test-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .test-details {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.5rem 1.5rem;
            font-size: 0.85rem;
        }

        .detail-row {
            display: contents;
        }

        .detail-label {
            color: var(--text-secondary);
            font-weight: 600;
        }

        .detail-value {
            font-family: 'JetBrains Mono', monospace;
            color: #334155;
            word-break: break-all;
        }

        .test-actions {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .test-status-badge {
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-align: center;
            min-width: 7.5rem;
        }

        .status-pending {
            background-color: var(--neutral-bg);
            color: var(--neutral-text);
            border: 1px solid var(--neutral-border);
        }

        .status-passed {
            background-color: var(--success-bg);
            color: var(--success-text);
            border: 1px solid var(--success-border);
        }

        .status-failed {
            background-color: var(--danger-bg);
            color: var(--danger-text);
            border: 1px solid var(--danger-border);
        }

        .btn-run-test {
            background-color: var(--accent-brand-light);
            color: var(--accent-brand-dark);
            border: 1px solid rgba(34, 197, 94, 0.2);
            padding: 0.6rem 1.2rem;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-run-test:hover {
            background-color: var(--accent-brand);
            color: white;
            border-color: var(--accent-brand);
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.2);
        }

        .btn-run-test:active {
            transform: scale(0.97);
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            .summary-stats {
                grid-template-columns: repeat(2, 1fr);
            }
            .test-card {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .test-number {
                margin: 0 auto;
            }
            .test-info {
                text-align: center;
            }
            .test-details {
                grid-template-columns: 1fr;
                text-align: center;
            }
            .test-actions {
                flex-direction: column;
                width: 100%;
            }
            .test-status-badge, .btn-run-test {
                width: 100%;
            }
            header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>Panel de <span>Pruebas Unitarias</span></h1>
                <p class="subtitle">Turnos YA - Motor de Reservas y Validación de Canchas</p>
            </div>
            <button id="btnRunAll" class="btn-run-all">Ejecutar Todo</button>
        </header>

        <!-- Resumen de estadísticas -->
        <div class="summary-stats">
            <div class="stat-card">
                <div id="statTotal" class="stat-value stat-total">13</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat-card">
                <div id="statPassed" class="stat-value stat-passed">0</div>
                <div class="stat-label">Pasaron</div>
            </div>
            <div class="stat-card">
                <div id="statFailed" class="stat-value stat-failed">0</div>
                <div class="stat-label">Fallaron</div>
            </div>
            <div class="stat-card">
                <div id="statPending" class="stat-value stat-pending">13</div>
                <div class="stat-label">Pendientes</div>
            </div>
        </div>

        <!-- Categorías de Pruebas -->
        <div id="testSuiteContainer">
            <!-- Se cargará dinámicamente con JS -->
        </div>
    </div>

    <!-- Ejecutor de los scripts de test -->
    <script type="module" src="./tests.js"></script>
</body>
</html>
